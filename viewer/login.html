<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deleting Reader</title>
<style>
  :root {
    --bg: #fbfaf7; --surface: #ffffff; --ink: #1c1b19; --muted: #6b6860;
    --line: #e1ded7; --accent: #2f5d50; --accent-ink: #ffffff; --danger: #a3361f;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161614; --surface: #1f1e1b; --ink: #ecebe6; --muted: #9a978e;
      --line: #34322d; --accent: #8cc1ac; --accent-ink: #10201a; --danger: #f08a73;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
    background: var(--bg); color: var(--ink);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  form {
    width: min(22rem, 100%); display: grid; gap: .9rem;
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 1.5rem;
  }
  h1 { font: 600 1.35rem/1.2 Georgia, "Iowan Old Style", serif; margin: 0; }
  label { display: grid; gap: .3rem; font-size: 13px; color: var(--muted); }
  input {
    font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px; padding: .55rem .65rem;
  }
  button {
    font: inherit; border: 0; border-radius: 8px; padding: .55rem .9rem; cursor: pointer;
    background: var(--accent); color: var(--accent-ink);
  }
  :is(input, button):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .error { color: var(--danger); font-size: 13px; margin: 0; }
</style>
</head>
<body>
<form method="post" action="login">
  <h1>Deleting Reader</h1>
  <label>Password <input type="password" name="password" autocomplete="current-password" required autofocus></label>
  <input type="hidden" name="next" id="next">
  <p class="error" id="error" role="alert" hidden>That password isn't right.</p>
  <button type="submit">Log in</button>
</form>
<script>
  const params = new URLSearchParams(location.search);
  // Where to go after logging in: the server can't see "#pdf/…", but the
  // browser keeps it in the address bar across the redirect to /login.
  document.getElementById("next").value = params.get("next") || location.hash;
  document.getElementById("error").hidden = params.get("error") !== "1";
</script>
</body>
</html>
