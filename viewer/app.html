<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deleting Reader</title>
<style>
  :root {
    --bg: #fbfaf7;
    --desk: #ecebe7;
    --surface: #ffffff;
    --ink: #1c1b19;
    --muted: #6b6860;
    --line: #e1ded7;
    --accent: #2f5d50;
    --accent-ink: #ffffff;
    --paper: #ffffff;
    --danger: #a3361f;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161614;
      --desk: #121211;
      --surface: #1f1e1b;
      --ink: #ecebe6;
      --muted: #9a978e;
      --line: #34322d;
      --accent: #8cc1ac;
      --accent-ink: #10201a;
      --danger: #f08a73;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: grid;
    grid-template-rows: auto 1fr;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  :is(button, select, input, textarea, summary, a):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Top bar */
  .top {
    position: sticky; top: 0; z-index: 5;
    display: flex; align-items: center; gap: .75rem;
    padding: .55rem 1rem;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
  }
  .brand { font: 600 15px/1 Georgia, "Iowan Old Style", serif; white-space: nowrap; }
  .spacer { flex: 1; }
  .seg {
    display: inline-grid; grid-auto-flow: column; grid-auto-columns: 1fr;
    border: 1px solid var(--line); border-radius: 8px; padding: 3px; background: var(--bg);
  }
  .seg button {
    border: 0; background: none; border-radius: 6px; padding: .3rem .8rem;
    font-size: 13px; color: var(--muted); cursor: pointer;
  }
  .seg button[aria-pressed="true"], .seg button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
  .top select {
    max-width: 22rem; min-width: 0; border: 1px solid var(--line); border-radius: 8px;
    background: var(--bg); padding: .35rem .5rem;
  }
  .btn {
    border: 1px solid var(--line); background: var(--surface); border-radius: 8px;
    padding: .4rem .85rem; cursor: pointer; white-space: nowrap;
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn:disabled { opacity: .6; cursor: progress; }
  .job { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 22rem; }
  .job a { color: var(--accent); font-weight: 600; }

  /* Menu under the top bar */
  .menu {
    position: fixed; z-index: 6; right: 1rem; top: 3.4rem;
    width: min(30rem, calc(100vw - 2rem));
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 8px 28px rgb(0 0 0 / .14);
    padding: 1rem;
  }
  .menu form { display: grid; gap: .75rem; }
  .menu label { display: grid; gap: .25rem; font-size: 13px; color: var(--muted); }
  .menu label.check { display: flex; align-items: center; gap: .5rem; color: var(--ink); }
  .menu :is(input:not([type="checkbox"]), select, textarea) {
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: .45rem .6rem; color: var(--ink);
  }
  .menu textarea { min-height: 11rem; resize: vertical; }
  .row { display: flex; gap: .75rem; flex-wrap: wrap; align-items: end; }
  .row > label { flex: 1 1 8rem; min-width: 0; }
  .menu :is(select, input[type="file"]) { width: 100%; min-width: 0; }
  .status { font-size: 13px; color: var(--muted); margin: .25rem 0 0; min-height: 1.2em; }
  .status.error { color: var(--danger); }

  /* Body: content plus level rail */
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 12.5rem; min-height: 0; }
  main { min-width: 0; }
  main.text { padding: 2.5rem 1.5rem 6rem; }
  main.pdf { background: var(--desk); padding: 1.5rem 1rem 4rem; overflow-x: auto; }
  .empty { color: var(--muted); text-align: center; padding: 4rem 1rem; }
  .empty.error { color: var(--danger); }

  article { max-width: 40rem; margin: 0 auto; }
  article p {
    font: 1.15rem/1.7 Georgia, "Iowan Old Style", serif;
    margin: 0 0 1.2em; text-wrap: pretty;
  }
  .w { transition: opacity .25s ease; }
  .w.gone { display: none; }

  .page {
    position: relative; margin: 0 auto 1.25rem; background: var(--paper);
    box-shadow: 0 1px 3px rgb(0 0 0 / .15), 0 4px 16px rgb(0 0 0 / .06);
  }
  .page canvas { display: block; width: 100%; height: 100%; }
  .overlay { position: absolute; inset: 0; pointer-events: none; }
  /* Paper-coloured box over a word: partly opaque fades it, opaque removes it. */
  .mask { position: absolute; background: var(--paper); opacity: 0; transition: opacity .25s ease; }
  .fixes { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; fill: #000; }
  .fixes .cover { fill: var(--paper); }
  /* pdf.js text layer: invisible text over the glyphs, for selecting, copying
     and find-in-page. Same rules as pdf.js's own viewer. */
  .textLayer {
    position: absolute; inset: 0; overflow: clip; opacity: 1; line-height: 1;
    text-size-adjust: none; forced-color-adjust: none; transform-origin: 0 0; caret-color: CanvasText;
  }
  .textLayer :is(span, br) { color: transparent; position: absolute; white-space: pre; cursor: text; transform-origin: 0% 0%; }
  .textLayer ::selection { background: rgb(0 90 200 / .28); }
  .textLayer br::selection { background: transparent; }
  .textLayer .endOfContent { display: block; position: absolute; inset: 100% 0 0; z-index: -1; cursor: default; user-select: none; }
  .textLayer.selecting .endOfContent { top: 0; }

  .rail {
    position: sticky; top: 3.1rem; align-self: start; height: calc(100vh - 3.1rem);
    padding: 1.5rem 1.25rem; border-left: 1px solid var(--line); background: var(--surface);
    display: flex; flex-direction: column; gap: 1.25rem;
  }
  .rail h1 { font: 600 13px/1.35 system-ui, sans-serif; margin: 0; }
  .meta { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; margin-top: .25rem; }
  .rail .seg { display: grid; }
  .slider { display: grid; grid-template-columns: auto 1fr; gap: .9rem; height: 16rem; }
  .slider input[type="range"] {
    writing-mode: vertical-lr; width: 1.5rem; height: 100%; margin: 0;
    appearance: none; background: none; cursor: pointer;
  }
  .slider input[type="range"]::-moz-range-track {
    width: 4px; height: 100%; border-radius: 2px;
    background: linear-gradient(var(--ink), color-mix(in srgb, var(--ink) 15%, transparent));
  }
  .slider input[type="range"]::-webkit-slider-runnable-track {
    width: 4px; height: 100%; border-radius: 2px;
    background: linear-gradient(var(--ink), color-mix(in srgb, var(--ink) 15%, transparent));
  }
  .slider input[type="range"]::-moz-range-thumb {
    width: 1.25rem; height: 1.25rem; border-radius: 50%;
    background: var(--surface); border: 2px solid var(--accent); box-shadow: 0 1px 3px rgb(0 0 0 / .2);
  }
  .slider input[type="range"]::-webkit-slider-thumb {
    appearance: none; margin-left: -8px; width: 1.25rem; height: 1.25rem; border-radius: 50%;
    background: var(--surface); border: 2px solid var(--accent); box-shadow: 0 1px 3px rgb(0 0 0 / .2);
  }
  .ticks {
    list-style: none; margin: 0; padding: .1rem 0;
    display: flex; flex-direction: column; justify-content: space-between;
    font-size: 13px; color: var(--muted);
  }
  .ticks li { cursor: pointer; line-height: 1.1; }
  .ticks li.on { color: var(--ink); font-weight: 600; }
  .ticks small { display: block; font-weight: 400; color: var(--muted); font-variant-numeric: tabular-nums; }
  .zoom { display: flex; gap: .4rem; align-items: center; }
  .zoom button { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; min-width: 2rem; height: 2rem; cursor: pointer; }
  .zoom output { min-width: 3.25rem; text-align: center; font-variant-numeric: tabular-nums; color: var(--muted); }
  .hint { font-size: 12px; color: var(--muted); margin: auto 0 0; }
  .form-note { font-size: 12px; color: var(--muted); margin: 0; }

  @media (max-width: 760px) {
    .brand { display: none; }
    .job { max-width: 9rem; }
    .top { gap: .5rem; padding: .5rem 16px; }
    .top select { max-width: 9rem; }
    .layout { grid-template-columns: 1fr; }
    .rail {
      position: sticky; top: 2.9rem; height: auto; z-index: 2; order: -1;
      border-left: 0; border-bottom: 1px solid var(--line); padding: .6rem 16px; gap: .5rem;
    }
    .rail .info, .hint, .ticks small { display: none; }
    .slider { height: auto; grid-template-columns: 1fr; }
    .slider input[type="range"] { writing-mode: horizontal-tb; width: 100%; height: 1.5rem; }
    .slider input[type="range"]::-moz-range-track {
      width: 100%; height: 4px;
      background: linear-gradient(to right, var(--ink), color-mix(in srgb, var(--ink) 15%, transparent));
    }
    .slider input[type="range"]::-webkit-slider-runnable-track {
      width: 100%; height: 4px;
      background: linear-gradient(to right, var(--ink), color-mix(in srgb, var(--ink) 15%, transparent));
    }
    .slider input[type="range"]::-webkit-slider-thumb { margin-left: 0; margin-top: -8px; }
    .ticks { flex-direction: row; }
    main.text { padding: 1.25rem 16px 4rem; }
    main.pdf { padding: 1rem 0 3rem; }
    .menu { top: 3rem; right: 16px; width: calc(100vw - 32px); }
  }
  @media (prefers-reduced-motion: reduce) { .w, .mask { transition: none; } }
</style>
</head>
<body>
<header class="top">
  <span class="brand">Deleting Reader</span>
  <div class="seg" role="tablist" aria-label="Mode">
    <button type="button" role="tab" id="tab-text" data-tab="text" aria-selected="true">Text</button>
    <button type="button" role="tab" id="tab-pdf" data-tab="pdf" aria-selected="false">PDF</button>
  </div>
  <span class="job" id="job" role="status"></span>
  <span class="spacer"></span>
  <select id="picker" aria-label="Open a previous result"></select>
  <button type="button" class="btn primary" id="new" aria-expanded="false" aria-controls="menu">New text</button>
</header>

<div class="menu" id="menu" hidden>
  <form id="text-form">
    <label>Title <input name="title" placeholder="Article title"></label>
    <label>Text <textarea name="text" placeholder="Paste paragraphs separated by blank lines"></textarea></label>
    <div class="row">
      <label>Model
        <select name="model">
          <option value="claude-sonnet-5-5">Claude Sonnet 5.5</option>
          <option value="claude-opus-5-5">Claude Opus 5.5</option>
          <option value="claude-haiku-5-5">Claude Haiku 5.5</option>
          <option value="local">Local (READER_BASE_URL)</option>
        </select>
      </label>
      <label>Effort
        <select name="effort">
          <option value="low">Low</option>
          <option value="medium" selected>Medium</option>
          <option value="high">High</option>
        </select>
      </label>
    </div>
    <div class="row">
      <button class="btn primary" type="submit">Process</button>
      <button class="btn" type="button" id="example">Load example</button>
    </div>
  </form>
  <form id="pdf-form" hidden>
    <label>PDF file <input type="file" name="pdf" accept="application/pdf,.pdf" required></label>
    <p class="form-note">Shortened by Sonnet 5.5, then checked by an Opus 5.5 judge and repaired.</p>
    <label class="check"><input type="checkbox" name="batch" checked> Batch: half price, usually a few minutes</label>
    <div class="row"><button class="btn primary" type="submit">Upload and process</button></div>
  </form>
  <p class="status" id="menu-status" role="status"></p>
</div>

<div class="layout">
  <main id="content" class="text"></main>
  <aside class="rail" aria-label="Reading level">
    <div class="info">
      <h1 id="title">Deleting Reader</h1>
      <div class="meta" id="meta"></div>
      <div class="meta" id="usage" title="Everything spent so far: shortening and judging, text and PDF"></div>
    </div>
    <div class="seg" role="group" aria-label="Display mode">
      <button type="button" data-view="grey" aria-pressed="true">Grey</button>
      <button type="button" data-view="remove" aria-pressed="false">Remove</button>
    </div>
    <div class="slider">
      <input type="range" id="level" min="0" max="4" step="1" value="0" aria-label="Level" aria-valuetext="Full text">
      <ol class="ticks" id="ticks"></ol>
    </div>
    <div class="zoom" id="zoom" role="group" aria-label="Page zoom" hidden>
      <button type="button" id="zoom-out" aria-label="Zoom out">−</button>
      <output id="zoom-value">100%</output>
      <button type="button" id="zoom-in" aria-label="Zoom in">+</button>
      <button type="button" id="zoom-fit">Fit</button>
    </div>
    <p class="hint" id="hint"></p>
    <form method="post" action="logout" id="logout" hidden><button class="btn" type="submit">Log out</button></form>
  </aside>
</div>

<script type="module">
import * as pdfjs from "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs";
pdfjs.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs";

// With a password set on the server, an expired login answers API calls with
// 401; send the reader to the login page instead of showing broken results.
const rawFetch = window.fetch.bind(window);
window.fetch = async (...args) => {
  const r = await rawFetch(...args);
  if (r.status === 401) location.href = `login?next=${encodeURIComponent(location.hash)}`;
  return r;
};

const LEVELS = 4;
const LABELS = ["Full text", "Level 1", "Level 2", "Level 3", "Core"];
// Text opacity per number of levels below the cut: GP-TSM's greys on white
// (#767676, #A0A0A0, #B9B9B9, #D0D0D0) as opacities, so they work in dark mode too.
const OPACITY = [1, 0.54, 0.37, 0.27, 0.18];
const HINTS = {
  text: "Slide down to condense. Arrow keys work once the slider has focus.",
  pdf: "Only body paragraphs are shortened. Titles, captions, figures and references stay as they are.",
};
const API = { text: "api/results", pdf: "api/papers" };

const $ = (id) => document.getElementById(id);
const state = { tab: "text", view: "grey", level: 0, data: null, pdf: null, zoom: null, masks: [] };

// Preferences

try {
  const p = JSON.parse(localStorage.getItem("reader") || "{}");
  if (p.view === "grey" || p.view === "remove") state.view = p.view;
  if (Number.isInteger(p.level) && p.level >= 0 && p.level <= LEVELS) state.level = p.level;
} catch {}
const savePrefs = () => {
  try { localStorage.setItem("reader", JSON.stringify({ view: state.view, level: state.level })); } catch {}
};

// Rail

function share(k) {
  let total = 0, kept = 0;
  for (const p of state.data?.paragraphs ?? []) {
    total += p.depth.length;
    kept += p.depth.filter((d) => d >= k).length;
  }
  return total ? Math.round((100 * kept) / total) : null;
}

function renderTicks() {
  $("ticks").innerHTML = "";
  LABELS.forEach((label, k) => {
    const li = document.createElement("li");
    li.className = k === state.level ? "on" : "";
    li.textContent = label;
    const s = share(k);
    if (s !== null) {
      const small = document.createElement("small");
      small.textContent = `${s}% of words`;
      li.append(small);
    }
    li.addEventListener("click", () => setLevel(k));
    $("ticks").append(li);
  });
}

const count = (n) => n.toLocaleString("en-US");
const dollars = (x) => `$${x.toFixed(2)}`;

function renderInfo() {
  const d = state.data;
  $("title").textContent = d?.title ?? "Deleting Reader";
  document.title = d ? `${d.title} – Deleting Reader` : "Deleting Reader";
  renderUsage();
  if (!d) {
    $("meta").textContent = "";
    return;
  }
  const parts = [
    `${d.model}${d.effort ? `, ${d.effort}` : ""}${d.batch ? ", batch" : ""}${d.variant ? `, ${d.variant}` : ""}`,
    `${d.paragraphs.length} paragraphs`,
  ];
  $("meta").textContent = parts.join(" · ");
}

async function renderUsage() {
  try {
    const u = await (await fetch("api/usage")).json();
    $("usage").textContent =
      `Total: ${count(u.input_tokens)} in / ${count(u.output_tokens)} out tokens · ${dollars(u.cost)}`;
  } catch {
    $("usage").textContent = "";
  }
}

function setLevel(k) {
  state.level = k;
  $("level").value = k;
  $("level").setAttribute("aria-valuetext", LABELS[k]);
  apply();
  renderTicks();
  savePrefs();
}

function setView(v) {
  state.view = v;
  document.querySelectorAll("[data-view]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.view === v)));
  apply();
  savePrefs();
}

const apply = () => (state.tab === "text" ? applyText() : applyPdf());

// Text mode

function renderText() {
  const main = $("content");
  main.innerHTML = "";
  const article = document.createElement("article");
  for (const p of state.data.paragraphs) {
    const el = document.createElement("p");
    p.words.forEach((w, i) => {
      const s = document.createElement("span");
      s.className = "w";
      s.dataset.i = i;
      s.textContent = w;
      el.append(s, " ");
    });
    article.append(el);
  }
  main.append(article);
  applyText();
}

function applyText() {
  const article = $("content").querySelector("article");
  if (!article || !state.data) return;
  const paras = article.children;
  const update = () => state.data.paragraphs.forEach((p, n) => {
    const shown = new Map(p.display[state.level] ?? []);
    for (const s of paras[n].children) {
      const i = Number(s.dataset.i);
      const d = p.depth[i];
      if (state.view === "grey") {
        s.classList.remove("gone");
        s.textContent = p.words[i];
        s.style.opacity = d >= state.level ? 1 : OPACITY[Math.min(state.level - d, LEVELS)];
      } else {
        s.style.opacity = 1;
        s.classList.toggle("gone", !shown.has(i));
        s.textContent = shown.get(i) ?? p.words[i];
      }
    }
  });
  // Cross-fade remove-mode reflows where the browser supports it.
  if (state.view === "remove" && document.startViewTransition && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
    document.startViewTransition(update);
  } else {
    update();
  }
}

// PDF mode

const measure = document.createElement("canvas").getContext("2d");
const FALLBACK_FONT = '"Linux Libertine O", "Libertinus Serif", "Times New Roman", serif';
const SVG = "http://www.w3.org/2000/svg";

function textItems(content, unit) {
  // Text runs in page points with a top-left origin (the viewport handles the
  // page box offset), with font and ascent.
  return content.items.filter((it) => it.str && it.str.trim()).map((it) => {
    const size = Math.hypot(it.transform[2], it.transform[3]);
    const [x, baseline] = unit.convertToViewportPoint(it.transform[4], it.transform[5]);
    return { x0: x, x1: x + it.width, baseline, size, font: it.fontName };
  });
}

// A visible word whose form changes in remove mode: capitalised as a
// sentence's new first word, given a moved full stop, or losing a leftover
// comma. Only the characters that change are touched: a paper-coloured box
// covers the old ones and the new ones are drawn as SVG text in the PDF's own
// embedded font (pdf.js registers it under the item's fontName) on the item's
// baseline. Redrawing whole words in that font can pick wrong glyphs, because
// pdf.js re-encodes embedded fonts (a ligature turned "flights" into "ftlights").
function makeFix(svg, b, word, items) {
  const mid = (b[2] + b[4]) / 2;
  const item = items.find((t) => t.x0 <= b[1] + 1 && t.x1 >= b[3] - 1 && t.baseline >= mid && t.baseline - t.size <= mid);
  const g = document.createElementNS(SVG, "g");
  svg.append(g);
  return {
    g, b, word,
    size: item?.size ?? (b[4] - b[2]) * 0.75,
    family: item ? `"${item.font}", ${FALLBACK_FONT}` : FALLBACK_FONT,
    baseline: item ? item.baseline : b[4] - (b[4] - b[2]) * 0.22,
  };
}

const TAIL = /[.,;:!?…"'”’)\]]*$/;
const splitTail = (s) => {
  const tail = s.match(TAIL)[0];
  return [s.slice(0, s.length - tail.length), tail];
};

// Width of part of the word, as a share of the box, measured in a common serif.
function partWidth(fix, part) {
  measure.font = `100px ${FALLBACK_FONT}`;
  const whole = measure.measureText(fix.word).width;
  return whole ? ((fix.b[3] - fix.b[1]) * measure.measureText(part).width) / whole : 0;
}

function coverPart(fix, x0, x1) {
  const h = fix.b[4] - fix.b[2];
  const r = document.createElementNS(SVG, "rect");
  r.setAttribute("x", x0);
  r.setAttribute("y", fix.b[2] - 0.04 * h);
  r.setAttribute("width", Math.max(0, x1 - x0));
  r.setAttribute("height", 1.2 * h);
  r.setAttribute("class", "cover");
  fix.g.append(r);
}

function draw(fix, x, text) {
  const t = document.createElementNS(SVG, "text");
  t.setAttribute("x", x);
  t.setAttribute("y", fix.baseline);
  t.setAttribute("font-size", fix.size);
  t.style.fontFamily = fix.family;
  t.textContent = text;
  fix.g.append(t);
}

// Shows the word as `text` (null: as printed). Returns true when the whole
// word had to be covered and redrawn.
function showFix(fix, text) {
  fix.g.replaceChildren();
  if (text === null) return false;
  const [oldBody, oldTail] = splitTail(fix.word);
  const [newBody, newTail] = splitTail(text);
  const recased = newBody !== oldBody;
  if (recased && newBody.toLowerCase() !== oldBody.toLowerCase()) {
    // Not a capitalisation or punctuation change; redraw the word.
    draw(fix, fix.b[1], text);
    return true;
  }
  if (recased) {
    // A changed first letter, drawn over its own position.
    const w = partWidth(fix, oldBody[0]);
    coverPart(fix, fix.b[1] - 0.2, fix.b[1] + w);
    draw(fix, fix.b[1], newBody[0]);
  }
  if (newTail !== oldTail) {
    // Swap trailing punctuation: cover the old marks, draw the new ones.
    const x = fix.b[3] - partWidth(fix, oldTail);
    if (oldTail) coverPart(fix, x, fix.b[3] + 0.5);
    if (newTail) draw(fix, x, newTail);
  }
  return false;
}

function fitZoom(width) {
  const avail = $("content").clientWidth - 32;
  return Math.max(0.5, Math.min(3, avail / width));
}

async function renderPdf() {
  const main = $("content");
  main.innerHTML = "";
  state.masks = [];
  const pdf = state.pdf;
  const base = (await pdf.getPage(1)).getViewport({ scale: 1 });
  if (state.zoom === null) state.zoom = fitZoom(base.width);
  const zoom = state.zoom;
  $("zoom-value").textContent = `${Math.round(zoom * 100)}%`;

  // Word boxes by page; each box is [page, x0, y0, x1, y1] in PDF points.
  const byPage = new Map();
  state.data.paragraphs.forEach((p, pi) => {
    p.boxes.forEach((boxes, i) => {
      for (const b of boxes) {
        if (!byPage.has(b[0])) byPage.set(b[0], []);
        // Only single-box words get redrawn; hyphenated ones stay as they are.
        byPage.get(b[0]).push({ b, depth: p.depth[i], pi, i, single: boxes.length === 1 });
      }
    });
  });

  for (let n = 1; n <= pdf.numPages; n++) {
    const page = await pdf.getPage(n);
    if (state.pdf !== pdf) return;  // another paper was opened meanwhile
    const vp = page.getViewport({ scale: zoom });
    const unit = page.getViewport({ scale: 1 });
    const div = document.createElement("div");
    div.className = "page";
    div.style.width = `${vp.width}px`;
    div.style.height = `${vp.height}px`;
    const canvas = document.createElement("canvas");
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.floor(vp.width * dpr);
    canvas.height = Math.floor(vp.height * dpr);
    div.append(canvas);

    const overlay = document.createElement("div");
    overlay.className = "overlay";
    const pending = [];
    for (const { b, depth, pi, i, single } of byPage.get(n - 1) ?? []) {
      const m = document.createElement("div");
      m.className = "mask";
      // Percentages keep masks aligned at any zoom. Word boxes stop short of
      // descenders and comma tails, so pad them a little, mostly downwards.
      const h = b[4] - b[2];
      const x0 = b[1] - 0.3, x1 = b[3] + 0.3, y0 = b[2] - 0.04 * h, y1 = b[4] + 0.16 * h;
      m.style.left = `${(x0 / unit.width) * 100}%`;
      m.style.top = `${(y0 / unit.height) * 100}%`;
      m.style.width = `${((x1 - x0) / unit.width) * 100}%`;
      m.style.height = `${((y1 - y0) / unit.height) * 100}%`;
      overlay.append(m);
      const entry = { el: m, depth, pi, i, fix: null };
      if (single) pending.push({ entry, b });
      state.masks.push(entry);
    }
    div.append(overlay);

    const text = document.createElement("div");
    text.className = "textLayer";
    // pdf.js sizes and places the text spans from these variables.
    text.style.setProperty("--scale-factor", zoom);
    text.style.setProperty("--total-scale-factor", zoom);
    div.append(text);
    main.append(div);

    const rendered = page.render({ canvasContext: canvas.getContext("2d"), viewport: page.getViewport({ scale: zoom * dpr }) }).promise;
    // Redrawn words need the page's fonts, which exist once the page is drawn.
    Promise.all([rendered, page.getTextContent()]).then(([, content]) => {
      const items = textItems(content, unit);
      const svg = document.createElementNS(SVG, "svg");
      svg.setAttribute("class", "fixes");
      svg.setAttribute("viewBox", `0 0 ${unit.width} ${unit.height}`);
      svg.setAttribute("preserveAspectRatio", "none");
      overlay.append(svg);
      for (const { entry, b } of pending) {
        entry.fix = makeFix(svg, b, state.data.paragraphs[entry.pi].words[entry.i], items);
      }
      applyPdf();
    }).catch((e) => console.error("page", n, e));
    new pdfjs.TextLayer({ textContentSource: page.streamTextContent(), container: text, viewport: vp })
      .render().catch((e) => console.error("text layer:", e));
    // Lets pdf.js keep the selection from jumping while dragging.
    text.addEventListener("mousedown", () => text.classList.add("selecting"));
  }
  applyPdf();
}
document.addEventListener("mouseup", () => document.querySelectorAll(".textLayer.selecting").forEach((t) => t.classList.remove("selecting")));

function applyPdf() {
  if (!state.data) return;
  // In remove mode a visible word may need another form at this level (see makeFix).
  const shown = state.view === "remove"
    ? state.data.paragraphs.map((p) => new Map(p.display?.[state.level] ?? []))
    : null;
  for (const { el, depth, pi, i, fix } of state.masks) {
    let cover = 0;
    if (depth < state.level) cover = state.view === "remove" ? 1 : 1 - OPACITY[Math.min(state.level - depth, LEVELS)];
    let replace = null;
    if (shown && depth >= state.level && fix) {
      const t = shown[pi].get(i);
      if (t !== undefined && t !== state.data.paragraphs[pi].words[i]) replace = t;
    }
    if (fix && showFix(fix, replace)) cover = 1;
    el.style.opacity = cover;
  }
}

function rezoom(z) {
  state.zoom = Math.max(0.5, Math.min(3, z));
  if (state.pdf && state.tab === "pdf") renderPdf();
}

// Opening results

function showEmpty(message, error = false) {
  state.data = null;
  state.masks = [];
  $("content").innerHTML = "";
  const p = document.createElement("p");
  p.className = error ? "empty error" : "empty";
  p.textContent = message;
  $("content").append(p);
  renderInfo();
  renderTicks();
}

async function open(tab, id) {
  const r = await fetch(`${API[tab]}/${id}`);
  if (state.tab !== tab) return;
  if (!r.ok) {
    showEmpty("Couldn't load that result.", true);
    return;
  }
  const data = await r.json();
  if (state.tab !== tab) return;
  state.data = data;
  $("picker").value = id;
  history.replaceState(null, "", `#${tab}/${id}`);
  renderInfo();
  renderTicks();
  if (tab === "text") {
    state.pdf = null;
    renderText();
  } else {
    $("content").innerHTML = '<p class="empty">Loading…</p>';
    state.zoom = null;
    state.pdf = await pdfjs.getDocument(`api/papers/${id}/paper.pdf`).promise;
    if (state.tab === "pdf" && state.data === data) await renderPdf();
  }
}

async function loadPicker(tab) {
  const items = await (await fetch(API[tab])).json();
  const sel = $("picker");
  sel.innerHTML = "";
  for (const it of items) {
    const o = document.createElement("option");
    o.value = it.id;
    o.textContent = it.kind === "paper" ? it.title : `${it.title} — ${it.model.replace("claude-", "")}${it.effort ? ` ${it.effort}` : ""}${it.variant ? `, ${it.variant}` : ""}`;
    sel.append(o);
  }
  sel.hidden = !items.length;
  return items;
}

async function setTab(tab, id = null) {
  state.tab = tab;
  state.data = null;
  state.pdf = null;
  state.masks = [];
  for (const b of document.querySelectorAll("[data-tab]")) b.setAttribute("aria-selected", String(b.dataset.tab === tab));
  $("content").className = tab;
  $("zoom").hidden = tab !== "pdf";
  $("hint").textContent = HINTS[tab];
  $("new").textContent = tab === "text" ? "New text" : "Upload PDF";
  $("text-form").hidden = tab !== "text";
  $("pdf-form").hidden = tab !== "pdf";
  setStatus("");
  closeMenu();
  const items = await loadPicker(tab);
  if (state.tab !== tab) return;
  const target = id && items.some((it) => it.id === id) ? id : items[0]?.id;
  if (target) {
    await open(tab, target);
  } else {
    history.replaceState(null, "", `#${tab}`);
    showEmpty(tab === "text" ? "Paste a text with New text." : "Upload a paper with Upload PDF.");
  }
}

// Menu

function openMenu() {
  $("menu").hidden = false;
  $("new").setAttribute("aria-expanded", "true");
  const first = (state.tab === "text" ? $("text-form") : $("pdf-form")).querySelector("input, textarea");
  first?.focus();
}
function closeMenu() {
  $("menu").hidden = true;
  $("new").setAttribute("aria-expanded", "false");
}
function setStatus(msg, error = false) {
  $("menu-status").textContent = msg;
  $("menu-status").className = error ? "status error" : "status";
}

$("new").addEventListener("click", () => ($("menu").hidden ? openMenu() : closeMenu()));
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && !$("menu").hidden) {
    closeMenu();
    $("new").focus();
  }
});
document.addEventListener("pointerdown", (e) => {
  if (!$("menu").hidden && !$("menu").contains(e.target) && e.target !== $("new")) closeMenu();
});

$("example").addEventListener("click", async () => {
  const text = await (await fetch("example.txt")).text();
  const [title, ...rest] = text.trim().split(/\n\s*\n/);
  // form.title is the form's own title attribute, so go through elements.
  $("text-form").elements.title.value = title.trim();
  $("text-form").elements.text.value = rest.join("\n\n");
});

$("text-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const button = e.submitter;
  button.disabled = true;
  setStatus("Processing… (about 10–60 s)");
  try {
    const r = await fetch("api/results", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(Object.fromEntries(new FormData(e.target))),
    });
    const body = await r.json();
    if (!r.ok) throw new Error(body.error || `HTTP ${r.status}`);
    setStatus("");
    closeMenu();
    if (state.tab === "text") {
      await loadPicker("text");
      await open("text", body.id);
    }
  } catch (err) {
    setStatus(`Couldn't process the text: ${err.message}`, true);
  } finally {
    button.disabled = false;
  }
});

$("pdf-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const form = new FormData(e.target);
  form.set("batch", e.target.elements.batch.checked ? "1" : "0");
  const button = e.submitter;
  button.disabled = true;
  setStatus("Uploading…");
  try {
    // Asked here because browsers only allow it in response to a click.
    if ("Notification" in window && Notification.permission === "default") Notification.requestPermission();
    const r = await fetch("api/papers", { method: "POST", body: form });
    const body = await r.json();
    if (!r.ok) throw new Error(body.error || `HTTP ${r.status}`);
    e.target.reset();
    if (body.state === "done") {
      setStatus("");
      closeMenu();
      await loadPicker("pdf");
      await open("pdf", body.id);
    } else {
      setStatus("Processing in the background. You can keep reading meanwhile.");
      watchJob(body.id);
    }
  } catch (err) {
    setStatus(`Couldn't upload: ${err.message}`, true);
  } finally {
    button.disabled = false;
  }
});

// Background PDF jobs: progress in the top bar, open the paper when done.
const watching = new Set();
function watchJob(id) {
  if (watching.has(id)) return;
  watching.add(id);
  const tick = async () => {
    const r = await fetch(`api/jobs/${id}`);
    const job = r.ok ? await r.json() : { state: "error", message: "job not found" };
    if (job.state === "running") {
      $("job").textContent = `${job.name ?? "PDF"}: ${job.message}`;
      setTimeout(tick, 3000);
      return;
    }
    watching.delete(id);
    const name = job.name ?? "PDF";
    if (job.state === "done") {
      if (state.tab === "pdf") await loadPicker("pdf");
      if (state.tab === "pdf" && !state.data) {
        $("job").textContent = `${name}: ready`;
        await open("pdf", id);
      } else {
        showReady(name, id);
      }
      notify(`${name} is ready`, "Open Deleting Reader to read it.");
    } else {
      $("job").textContent = `${name}: failed`;
      setStatus(`Processing failed: ${job.message}`, true);
      notify(`${name} failed`, job.message);
    }
  };
  tick();
}

// "name: ready · Open" in the top bar, for a paper that finished while
// something else was open.
function showReady(name, id) {
  const box = $("job");
  box.textContent = `${name}: ready · `;
  const link = document.createElement("a");
  link.href = `#pdf/${id}`;
  link.textContent = "Open";
  link.addEventListener("click", (e) => {
    e.preventDefault();
    box.textContent = "";
    if (state.tab === "pdf") open("pdf", id);
    else setTab("pdf", id);
  });
  box.append(link);
}

// Browser notification, only when the page is in the background and the
// reader allowed it (asked on the first upload).
function notify(title, body) {
  if (!document.hidden || !("Notification" in window) || Notification.permission !== "granted") return;
  try { new Notification(title, { body }); } catch {}
}

// Wiring

$("picker").addEventListener("change", (e) => open(state.tab, e.target.value));
$("level").addEventListener("input", (e) => setLevel(Number(e.target.value)));
document.querySelectorAll("[data-view]").forEach((b) => b.addEventListener("click", () => setView(b.dataset.view)));
document.querySelectorAll("[data-tab]").forEach((b) => b.addEventListener("click", () => {
  if (b.dataset.tab !== state.tab) setTab(b.dataset.tab);
}));
$("zoom-in").addEventListener("click", () => rezoom(state.zoom * 1.2));
$("zoom-out").addEventListener("click", () => rezoom(state.zoom / 1.2));
$("zoom-fit").addEventListener("click", async () => {
  if (state.pdf) rezoom(fitZoom((await state.pdf.getPage(1)).getViewport({ scale: 1 }).width));
});

$("level").value = state.level;
setView(state.view);
const [tab, id] = location.hash.slice(1).split("/");
setTab(tab === "pdf" ? "pdf" : "text", id || null);
fetch("api/jobs").then((r) => r.json()).then((jobs) => jobs.forEach((j) => watchJob(j.id)));
fetch("api/config").then((r) => r.json()).then((c) => { $("logout").hidden = !c.auth; });
</script>
</body>
</html>
